name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -B -m unittest discover -s tests/server -p 'test_*.py'
      - run: docker build -t nexus-panel:ci .
      - run: bash scripts/compose-smoke.sh nexus-panel:ci
